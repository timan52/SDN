<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SDN · Portrait Editor Test</title><link rel="stylesheet" href="styles.css"><script defer src="portrait-editor.js"></script><style>body{background:#122a29;color:#e7e5d3;font-family:monospace;padding:30px;max-width:880px;margin:auto}.demo-content{display:flex;flex-wrap:wrap;align-items:start;gap:25px;margin-top:22px}.demo-frame{width:200px;background:#e4e4d8;color:#1b3733;padding:12px}.demo-frame img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#56675b}button{background:#ef9947;color:#152d28;padding:12px 20px;font-weight:bold;cursor:pointer;border:none}#meta{font-size:12px;color:#bacac2;max-width:500px;line-height:1.8}</style></head><body><h1>SDN // PORTRAITEDITOR</h1><p>Lokale Testseite für den Ausschnitt-Editor, ohne Konto und ohne Upload. Diese Datei dient nur zur Funktionsprüfung und gehört nicht ins öffentliche GitHub-Repository.</p><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><button id="go">BILDAUSSCHNITT TESTEN</button><div class="demo-content"><div class="demo-frame"><img id="picture" alt="Vorschau"/><strong>OFFIZIELLES PORTRAIT</strong></div><pre id="meta">Kein Portrait ausgewählt.</pre></div><script>document.getElementById('go').onclick=async()=>{const file=document.getElementById('file').files[0];if(!file){alert('Bitte ein Bild auswählen.');return;}try{const result=await window.SDNPortraitEditor.edit(file);if(!result)return;document.getElementById('picture').src=URL.createObjectURL(result.preview);document.getElementById('meta').textContent=`WebP: ${Math.round(result.preview.size/1024)} KB\nAusschnitt: ${JSON.stringify(result.crop,null,2)}`;}catch(e){alert(e.message);}};</script></body></html>
